name: milo-storybook-proxy

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      # Scheduled and manual runs pull in the latest Milo before building.
      - name: Merge upstream Milo stage
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/adobecom/milo.git stage
          git merge --no-edit FETCH_HEAD
          git push origin dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: milo-storybook-proxy/package-lock.json

      - run: npm ci
        working-directory: milo-storybook-proxy

      - run: npm run build
        working-directory: milo-storybook-proxy

      - uses: actions/upload-pages-artifact@v5
        with:
          path: milo-storybook-proxy/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
